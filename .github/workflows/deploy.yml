name: Build & deploy

# Reusable so refresh.yml can call it directly. That matters: a commit pushed
# with the default GITHUB_TOKEN does NOT trigger other workflows, so a cron
# refresh would otherwise update the data and never redeploy the site.
on:
  # Fires on any branch but the job below runs only for the repository's
  # default branch, whatever it is called. Hardcoding `main` silently breaks
  # the moment the default is something else — which is exactly what happened
  # here, where the first pushed branch became the default.
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_call/dispatch always build; a plain push only from the default branch.
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
